# BOLT asset universe - FROZEN. Never edited after Phase 1 (BOLT_SPEC.md Section 2).
#
# Universe as declared in BOLT_Base_Paper_Answers.pdf, Section 12.
#
# Each asset carries two fields the pipeline depends on:
#   role     - "target"  : crash labels are produced for this asset
#              "context" : included in the cross-asset panel for contagion
#                          features (G2) but never labelled or predicted.
#              Stablecoins are context-only: a 20% drawdown in a token pegged
#              to the dollar is a de-peg, not a market crash, so labelling them
#              would produce an all-negative column and silently distort the
#              positive-class rate. Their FLOWS are exactly what we want as a
#              feature (see the USDC de-peg episode), which is why they stay in.
#   inception - first date with reliable public market data. The panel is
#              deliberately RAGGED: assets are absent before this date rather
#              than back-filled. Guard 1 (point-in-time) forbids inventing history.
#
# NOTE ON SHORT HISTORIES: HYPE (Nov 2024) and ASTER (Sep 2025) post-date every
# crisis episode in config/default.yaml. They can never contribute to episode-level
# analysis (G4) and contribute to contagion features only in the final fold.
# They are retained because the universe is frozen and honesty about coverage is
# the point; data/processed/DATA_CARD.md reports their coverage explicitly.

universe:
  - symbol: BTC
    name: Bitcoin
    coingecko_id: bitcoin
    binance_symbol: BTCUSDT
    role: target
    inception: "2013-04-28"
  - symbol: ETH
